<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <a
        href="/"
        class="brand"
    >
        FitBuddy
    </a>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/view-all-users">
            Admin
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="page">

    {% block content %}
    {% endblock %}

</main>


<footer>

    FitBuddy — AI Fitness Plan Generator

</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>

</html>
