services:
  - type: web
    name: fitbuddy-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_WORKOUT_MODEL
        value: gemini-3.8-flash
      - key: AI_TIP_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        value: sqlite:///./fitbuddy.db